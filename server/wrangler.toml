name = "fleavi-proxy"
main = "index.js"
compatibility_date = "2024-01-01"

[vars]
OPENAI_MODEL = "gpt-4o-mini"
FREE_DAILY_LIMIT = "20"

# KV namespace for rate limiting (create with: wrangler kv:namespace create RATE_LIMITS)
# Then paste the ID below:
# [[kv_namespaces]]
# binding = "RATE_LIMITS"
# id = "YOUR_KV_NAMESPACE_ID"
